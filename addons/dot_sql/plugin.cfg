[plugin]

name="dot-sql"
description="SQL for the Dot family: SQLite through a GDExtension, PostgreSQL and MySQL through an HTTP gateway, one dialect layer, tables as plain data, and versioned migrations. Stores in other addons reach it duck-typed, so none of them depends on it. Depends only on dot-core."
